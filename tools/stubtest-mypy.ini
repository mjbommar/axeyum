# mypy settings for `python -m mypy.stubtest axeyum._native`.
#
# `stubtest` first BUILDS the stub package with mypy and refuses to compare
# anything if that build fails -- it prints "not checking stubs due to mypy
# build errors" and exits 1, which looks like a stub problem and is not one.
# So a build error here does not weaken the comparison; it prevents it entirely,
# and every entry below exists to let the comparison happen.
#
# One module, one error code, one reason. Nothing is disabled globally.

[mypy]

[mypy-axeyum._native.cas.certify.sturm]
# `Interval(a, b)` RETURNS `None` when `a > b`, deliberately: an empty interval
# is not an interval, and `python/tests/test_cas_certify.py` pins
# `sturm.Interval(Fraction(3), Fraction(1)) is None`. `#[new]` in Rust is
# `-> PyResult<Option<Interval>>` and the generated stub says so.
#
# mypy's `misc` check requires `__new__` to return an instance of its class.
# That is a typeshed convention, not a language rule -- `__new__` returning
# something else is legal and is what this constructor does. Disabling `misc`
# for this ONE module lets the rest of the package be compared; the alternative
# is that stubtest checks nothing at all.
disable_error_code = misc
