[package]
name = "cas-capability-corpus"
version = "0.1.0"
edition = "2021"
publish = false

# NOT a workspace member. The `[workspace]` table below detaches this crate from
# the repository workspace so `cargo test --workspace`, `cargo deny`, and
# `scripts/check.sh` never build it. It is a measurement harness, not product
# code.
[workspace]

[dependencies]
axeyum-ir = { path = "../../../../crates/axeyum-ir" }
axeyum-solver = { path = "../../../../crates/axeyum-solver", features = ["full"] }

[profile.release]
opt-level = 3
