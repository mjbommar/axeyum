# Formal Mathematics Tour — machine-readable knowledge graph.
#
# Authoritative node/edge list for the curriculum. Per-node prose lives in the
# sibling markdown files (path = "<area-folder>/<id>.md"); this file is the
# graph (prerequisites = edges) plus the axeyum decidability/testability
# metadata. See README.md.
#
# Invariants (validated by axeyum-scenarios::mathtour tests, which mirror this
# graph): every `prerequisites` id exists; the graph is acyclic; every
# `unlocks` is the inverse of some `prerequisites`.
#
# Field legend:
#   layer         0 foundations · 1 number systems · 2 structures · 3 destinations
#   decidability  decidable | computable | bounded | undecidable
#                   decidable  — a complete decision procedure (e.g. propositional)
#                   computable — answer is computed then checked (e.g. gcd)
#                   bounded    — only finite/fixed instances are decided
#                   undecidable— general case is Lean-horizon, not a benchmark
#   axeyum_theory the theory whose testable fragment this node maps to
#   family        the axeyum-scenarios Family that exercises it ("" = not yet)
#   status        covered | planned | lean-horizon
#   kernel_decls  MEASURED count of axeyum-lean-kernel declarations (all kinds)
#                 attributed to this node -- a SECOND, INDEPENDENT axis
#
# `status`/`family` are the SCENARIO axis and nothing else. `Status::Covered`
# in crates/axeyum-scenarios/src/mathtour.rs is defined as "has a self-checking
# exercise family today", and a test enforces exactly that; `LeanHorizon` means
# "primarily a proof-reconstruction target, not a benchmark". Neither value
# says anything about what the Lean-core kernel has PROVED, and reading them as
# if they did the two axes disagree in opposite directions (ADR-1075):
# `calculus` is `lean-horizon` with 349 kernel declarations, `linear-algebra`
# is `covered` with 90.
#
# `probability` (ADR-1082) is the first node added past the original 23: the
# same class of measurement found 47 `Rat` declarations (distributions,
# expectation, variance, covariance with Cauchy-Schwarz, Markov, Chebyshev,
# the weak law of large numbers) with no node to attribute to, filed under
# `rationals` only for want of a better bucket. It is `status = "planned"`
# -- the first node to use that value -- because the content is
# bounded/computable (not a proof-reconstruction target) but no `Family`
# scenario exists for it yet. See
# DEPTH-PROPOSAL-number-theory-and-linear-algebra.md `S3`.
#
# `kernel_decls` is that second axis, stated separately
# so neither can be mistaken for the other. It is a measurement, not a
# judgement:
#
#   cargo run --release -p axeyum-lean-kernel \
#     --example kernel_declaration_projection > /tmp/proj.tsv
#   python3 scripts/measure-curriculum-kernel-coverage.py /tmp/proj.tsv \
#     --expect-attributed 2522 --require-node probability \
#     --require-node linear-algebra --require-node number-theory
#
# Measured 2026-08-31 (ADR-1205) over 2,654 distinct declarations, every one
# axiom-free (2,522 attribute to a node; the same 132 residual as every prior
# run -- 30 legacy `AxReal` axioms, the 94-declaration string package, 8
# not-yet-bucketed carrier/misc declarations). Total moved from the
# 2,615/2,483 ADR-1140 measured hours earlier the same day: +39 declarations
# landed in the interim (Gauss's lemma for QR, ADR-1130; the second
# supplementary law, ADR-1150; Laplace row expansion, ADR-1155; 12 `Nat`
# min/max mirrors) and every one of them attributed, none fell into the
# residual.
#
# THAT +39 WOULD HAVE BEEN WRONG BY 29 WITHOUT A SECOND BUCKET FIX. Re-running
# ADR-1140's own instrument found the SAME class of bug it had just fixed,
# recurring one layer over: the `number-theory` pattern's Gauss's-lemma
# alternative was the literal string `gauss_fold_injective` (added when only
# one declaration of that shape existed), so the 29 new declarations from
# ADR-1130/1150's Gauss's-lemma-for-quadratic-reciprocity family --
# `gaussLemmaSignCount`, `gaussSignNeg`, `gaussFold`, `gaussNegCount`,
# `gauss_neg_count_*`, `gauss_fold_*`, `secondSupplementaryLaw`,
# `is_quadratic_residue*`, `pow_neg_one_of_*`, `half_ceil_parity`, `leastResidue`
# -- matched none of the existing alternatives and fell through to the
# `naturals`/`integers` catch-alls, silently, exactly as ADR-1140 describes.
# `linear-algebra`'s bucket had a matching one-declaration miss:
# `Rat.sumRange_matSkip` (a Laplace reindexing lemma) starts with `sumRange_`,
# not `mat`, so it fell to `rationals`. Both fixed by widening the two
# patterns in `scripts/measure-curriculum-kernel-coverage.py`; deliberately
# did NOT widen `number-theory`'s pattern to match bare `gauss_lemma` --
# `Nat.gauss_lemma`/`Int.gauss_lemma` is a DIFFERENT theorem (the divisibility
# one, `gcd x y = 1 -> x|yz -> x|z`) correctly bucketed to
# `divisibility-and-euclid`, same colloquial name, unrelated statement. Six
# `kernel_decls` values moved this pass: `propositional-logic` 64->65 (a new
# core declaration, unrelated to either bucket fix), `naturals` 516->518,
# `integers` 193->189, `rationals` 204->206, `number-theory` 108->137,
# `linear-algebra` 81->90. Every drift was verified BY NAME against the fixed
# patterns, not inferred from the totals (ADR-1140's own caution, restated:
# an unmatched item is absorbed by a catch-all rather than reported, so a
# stable total after a real bug fix is not evidence of nothing having moved --
# here the totals for `naturals`/`integers` moved noticeably and `rationals`
# barely, which is exactly what a name-level audit would predict and a
# totals-only read would not have caught the `sumRange_matSkip` case at all).
#
# Re-measure rather than trust any number above; the script's attribution
# table is auditable and its residual is printed. See ADR-1075, ADR-1140,
# ADR-1205.

[meta]
title = "Formal Mathematics Tour"
description = "Backward-derived prerequisite DAG from calculus / number theory / linear algebra to foundations, with axeyum's testable fragment per node."
adr = "adr-0033-double-duty-educational-artifacts"
note = "docs/research/08-planning/formal-mathematics-tour.md"

