# Micro-benchmarks (2026-09-07, lane `bench-primitives`); `harness = false`
# hands control to `criterion`'s own main. Inputs are committed corpus files,
# so these are not proxies -- see each bench's module doc.
[[bench]]
name = "smtlib_parse"
harness = false
