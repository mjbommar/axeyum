[package]
name = "axeyum-egraph"
description = "Incremental congruence-closure e-graph for Axeyum: the shared equality bus (keystone)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# ADR follow-up to the 2026-09-05 architecture review, recommendation D5/6
# ("swap the hasher ... measure on the intern table first"). That pass landed
# in `axeyum-ir` and was explicitly scoped to it; this crate was in the
# untouched remainder. Measured 2026-09-10 on QF_UF/QG-classification: SipHash
# over `ENodeId` (a `u32` newtype) was 18.5% of a 60 s solve, with another
# 15.5% in the surrounding map machinery.
rustc-hash = { workspace = true }

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

# Micro-benchmark (2026-09-05, design review §4 item 3); `harness = false`
# hands control to `criterion`'s own main.
[[bench]]
name = "congruence_chain"
harness = false
