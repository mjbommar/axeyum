[package]
name = "axeyum-arith"
description = "Shared exact-arithmetic layer for Axeyum: dyadic rationals, certified radix conversion, and the interface contracts for big rationals, polynomials, modular rings and algebraic numbers (ADR-1710)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The only dependencies, all pure Rust and MIT OR Apache-2.0, so this
# crate builds for `wasm32-unknown-unknown` and `wasm32-wasip1` and adds no
# C/C++ surface (the ADR-0002 hard rule). Resolved through
# `[workspace.dependencies]` (ADR-1710 slice 0) so this crate, `axeyum-ir`,
# `axeyum-cas`, `axeyum-fp` and `axeyum-lean-kernel` all resolve one version.
# No default features beyond `std`.
num-bigint.workspace = true
num-rational.workspace = true
num-integer.workspace = true
num-traits.workspace = true

[lints]
workspace = true
