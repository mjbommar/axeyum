[package]
name = "axeyum-arith"
description = "Shared exact-arithmetic layer for Axeyum: dyadic rationals, certified radix conversion, and the interface contracts for big rationals, polynomials, modular rings and algebraic numbers (ADR-1710)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The only two dependencies, both pure Rust and MIT OR Apache-2.0, so this
# crate builds for `wasm32-unknown-unknown` and `wasm32-wasip1` and adds no
# C/C++ surface (the ADR-0002 hard rule). The versions match the ones already
# resolved in `Cargo.lock` for `axeyum-ir`, `axeyum-cas`, `axeyum-fp` and
# `axeyum-lean-kernel`, so this crate introduces no new registry version into
# the tree. No default features beyond `std`.
num-bigint = { version = "0.4" }
num-rational = { version = "0.4", default-features = false, features = ["num-bigint"] }

[lints]
workspace = true
