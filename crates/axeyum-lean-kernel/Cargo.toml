[package]
name = "axeyum-lean-kernel"
description = "In-tree Rust Lean kernel for Axeyum: lifetime-free interned Name/Level/Expr + de Bruijn ops (ADR-0036)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
num-bigint = "0.4"

[dev-dependencies]
# CAS -> kernel polynomial-identity bridge tests only (`complex/cas_bridge_tests.rs`,
# `rat_prelude/cas_ivt_bridge_tests.rs`, both `#[cfg(test)]`). This is the
# "untrusted fast search" half depending on the "trusted small checking" half
# for TEST purposes only -- axeyum-cas does not depend back on
# axeyum-lean-kernel, so there is no cycle, and the default library build
# (what ships) never links it.
axeyum-cas.workspace = true
# `rat_prelude/cas_ivt_bridge_tests.rs` builds `axeyum_cas::real_algebraic`
# certificates directly from `axeyum_ir::Rational` literals (the CAS's own
# fixed-width `i128` rational, not this kernel's bignum `Rat` carrier) --
# `axeyum-cas` does not re-export it, so this needs to be named directly.
# Same dev-only, no-cycle reasoning as `axeyum-cas` above.
axeyum-ir.workspace = true
# `examples/structural_index_extract.rs` (L3 phase D2, ADR-0905) hashes
# sorted lists of declaration names into a stable content fingerprint for a
# retrieval index -- not security-sensitive, just a cheap way to compare two
# dependency sets by digest instead of by full list. Pure Rust, already
# resolved transitively in Cargo.lock via other workspace crates, so this
# adds no new C/C++ surface (ADR-0002) and no new network-visible version.
sha2 = "0.11"
# `examples/declaration_spec_pilot.rs` (L3 phase D1, ADR-0965) reads a
# declaration-spec JSON file at runtime (artifacts/declaration-spec/) and
# interprets its expression DSL into kernel builder calls. `serde_json::Value`
# only -- no derive macros, no schema-specific types -- to parse a fixed,
# already-Python-validated JSON shape with minimal new surface. Already a
# dev-dependency of other workspace crates (axeyum-bench, axeyum-smtlib, …),
# so this adds no new dependency to the tree, only a new edge to it.
serde_json = "1"

[lints]
workspace = true
