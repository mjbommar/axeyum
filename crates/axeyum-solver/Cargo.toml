[package]
name = "axeyum-solver"
description = "Solver backend trait, results, models, and capabilities for the Axeyum automated reasoning stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
axeyum-aig.workspace = true
axeyum-bv.workspace = true
# Exact multivariate polynomial normalization for the `cas-*` refutation routes
# (ADR-0386). Pure Rust and WASM-safe, so it does not touch the
# no-C-dependency promise; `full`-only because the routes live in `auto.rs`.
axeyum-cas = { workspace = true, optional = true }
axeyum-cnf.workspace = true
axeyum-egraph = { workspace = true, optional = true }
axeyum-fp = { workspace = true, optional = true }
axeyum-ir.workspace = true
axeyum-lean-kernel = { path = "../axeyum-lean-kernel", optional = true }
axeyum-query.workspace = true
axeyum-rewrite = { path = "../axeyum-rewrite" }
axeyum-smtlib = { path = "../axeyum-smtlib", optional = true }
axeyum-strings = { workspace = true, optional = true }
z3 = { workspace = true, optional = true }

# Browser-compatible monotonic clock for timeouts/telemetry (ADR-0017); only on
# wasm32, where `std::time::Instant` has no clock in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[features]
# Native backends are feature-gated leaf dependencies; the default build has
# no C or C++ build requirement (ADR-0002).
default = ["qfbv"]
# Minimal pure-Rust scalar QF_BV surface. This is the default deployment profile;
# full multi-theory consumers opt into `full` explicitly. The named feature
# makes consumer intent visible even though it adds no dependencies by itself.
qfbv = []
# ADR-1703: forwards to `axeyum-cnf/batsat-reference` so the two MEASUREMENT
# harnesses that time the retired adapter (`native_cdcl_baseline`,
# `xor_cdcl_curated_measure`) can still be run. Non-default; both suites compile
# to ZERO tests without it and exit 0.
batsat-reference = ["axeyum-cnf/batsat-reference"]
# Full multi-theory/product surface.
full = [
    "dep:axeyum-cas",
    "dep:axeyum-egraph",
    "dep:axeyum-fp",
    "dep:axeyum-lean-kernel",
    "dep:axeyum-smtlib",
    "dep:axeyum-strings",
]
# Z3 oracle backend linked against the system libz3 (found via pkg-config).
z3 = ["full", "dep:z3"]
# Use a prebuilt static libz3 instead of the system library; hermetic for CI
# and machines without libz3-dev. Implies `z3`.
z3-static = ["z3", "z3/gh-release"]
# Bench-only escape hatch (2026-09-05 micro-benchmarks): re-exports the
# otherwise crate-private `CdclT`/`Lit`/`Outcome` (cdclt.rs) and
# `Incremental`/`Status` (simplex.rs) through `bench_internals` so
# `benches/*.rs` (a separate crate) can drive them directly. Implies `full`
# because both modules only exist under it. Never enable this outside a
# bench target.
bench-internals = ["full"]

[lints]
workspace = true

[dev-dependencies]
axeyum-scenarios = { path = "../axeyum-scenarios" }
criterion.workspace = true

[[example]]
name = "geometry_portfolio"
required-features = ["full"]

[[example]]
name = "first_smtlib_query"
required-features = ["full"]

[[example]]
name = "infeasibility_iis"
required-features = ["full"]

[[example]]
name = "infeasibility_farkas_lean"
required-features = ["full"]

[[example]]
name = "reconstruct_ceiling_probe"
required-features = ["full"]

[[example]]
name = "reconstruct_differential_probe"
required-features = ["full"]

[[example]]
name = "reconstruct_lean_certificate"
required-features = ["full"]

# Micro-benchmarks (2026-09-05, design review §4 item 3). Both require
# `bench-internals` (implies `full`) since they drive `CdclT`/`Incremental`
# directly through `bench_internals`; `harness = false` hands control to
# `criterion`'s own main.
[[bench]]
name = "cdclt_propagate"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "simplex_pivot"
harness = false
required-features = ["bench-internals"]
