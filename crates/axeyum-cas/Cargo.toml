[package]
name = "axeyum-cas"
description = "Proof-carrying computer algebra for Axeyum: symbolic transforms whose results are certified by lowering to the decidable IR core (ADR-0301)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The decidable core: exact `Rational` arithmetic and univariate polynomial
# algebra (`poly::rat_derivative`, ...) used as the trusted certifier. Pure Rust,
# WASM-safe. No solver dependency: Phase C0 certifies entirely via exact
# polynomial normal forms (the normal form *is* the witness).
axeyum-ir.workspace = true
# The shared exact-arithmetic layer (ADR-1710). `ntheory.rs`'s two integer
# `pow_mod`s delegate to its `ModularRing`/`PowModCertificate` (migration
# slice 2); `gfp.rs` and `factor_int.rs`'s 𝔽ₚ[x] polynomial `pow_mod`s do not
# (see their own doc comments for why).
axeyum-arith.workspace = true
# Exact bounded intermediates for small linear systems, moment composition,
# product-scalar cancellation, concrete WZ base checking, and
# polynomial-geometric Z-transform composition. Public CasExpr coefficients
# remain checked i128 rationals. These are the same pure-Rust bignum crates
# already used unconditionally by axeyum-ir.
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true
