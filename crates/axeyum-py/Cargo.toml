[package]
name = "axeyum-py"
description = "Python bindings for the Axeyum automated reasoning stack (the `axeyum._native` extension module)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
# The built artifact is imported as `axeyum._native`; `module-name` in the root
# `pyproject.toml` places it inside the pure-Python package.
name = "_native"
# `rlib` keeps `cargo test --workspace` able to compile and link this crate as an
# ordinary library; `cdylib` is what maturin turns into the wheel's `.so`.
crate-type = ["cdylib", "rlib"]

# The typed-stub generator. `required-features` is what keeps it out of the
# default build: without `--features stub-gen` cargo does not even try to build
# this target, so `cargo check --workspace` never pulls the gatherer in.
[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]

[features]
# OFF BY DEFAULT, AND DELIBERATELY ABSENT FROM `[tool.maturin] features` IN THE
# ROOT `pyproject.toml`. `pyo3-stub-gen` works by `inventory::submit!`ing a
# `PyClassInfo`/`PyFunctionInfo` record for every annotated item into a link
# section that is walked at run time. Those records are static data in the
# shipped `.so` -- roughly one per class, method and function, each carrying the
# item's name, doc string and a function pointer per parameter type -- and the
# extension module never reads them. Enabling this feature for the wheel would
# put ~1,400 such records into the artifact for the sole benefit of a build-time
# tool. So the wheel is built without it, and the stubs are generated by a
# SEPARATE `cargo run --features stub-gen --bin stub_gen`, which links the same
# library with the gatherer turned on.
stub-gen = ["dep:anyhow", "dep:pyo3-stub-gen"]

[dependencies]
axeyum-aig = { path = "../axeyum-aig", version = "0.1.0" }
axeyum-bv = { path = "../axeyum-bv", version = "0.1.0" }
axeyum-cas = { path = "../axeyum-cas", version = "0.1.0" }
axeyum-cnf = { path = "../axeyum-cnf", version = "0.1.0" }
axeyum-egraph = { path = "../axeyum-egraph", version = "0.1.0" }
axeyum-fp = { path = "../axeyum-fp", version = "0.1.0" }
axeyum-ir.workspace = true
axeyum-lean-import = { path = "../axeyum-lean-import", version = "0.1.0" }
axeyum-lean-kernel = { path = "../axeyum-lean-kernel", version = "0.1.0" }
axeyum-machine = { path = "../axeyum-machine", version = "0.1.0" }
axeyum-query = { path = "../axeyum-query", version = "0.1.0" }
axeyum-smtlib = { path = "../axeyum-smtlib", version = "0.1.0" }
# `full` is the profile the SMT-LIB front door (ADR-0052) needs; it is pure Rust
# (the C/C++ `z3` backend is a separate feature and stays off), so the
# no-C-dependency promise (ADR-0002) is untouched.
axeyum-solver = { path = "../axeyum-solver", version = "0.1.0", default-features = false, features = [
    "full",
] }
# EXACT pin: the surface uses `#[pymodule(gil_used = ...)]` and `Python::detach`,
# both of which moved recently. `pyo3/extension-module` is deliberately NOT a
# default feature here -- as a Cargo default it makes `cargo test --workspace`
# fail to link, so it is supplied only by `[tool.maturin] features`.
pyo3 = { version = "=0.29.2", features = ["abi3-py312"] }

# Typed `.pyi` generation from the Rust signatures (feature `stub-gen`, off by
# default). `default-features = false` drops `numpy`, `either`, `ordered-float`
# from the default set: none of this crate's signatures mention those types, so
# the default set would only add build-time dependencies. The derive macros are
# re-exported as `pyo3_stub_gen::derive::*`, so the proc-macro crate is NOT a
# separate dependency here -- and because every annotation is written as
# `#[cfg_attr(feature = "stub-gen", pyo3_stub_gen::derive::gen_stub_*)]`, the
# path is never resolved when the feature is off.
#
# Version floor `0.23`: it is the first release whose `pyo3` requirement
# (`>=0.27, <0.30`) admits the `=0.29.2` pinned above.
pyo3-stub-gen = { version = "0.23", optional = true, default-features = false, features = [
    # Renders a real default value (`= 5000`) instead of `...` where PyO3
    # recorded one, so the stub carries the same defaults the runtime does.
    "infer_signature",
] }
# `pyo3_stub_gen::Result` is `anyhow::Result`; the generator binary and the
# gatherer need the error type to report a miss. Feature-gated with it.
anyhow = { version = "1", optional = true }

# TEST-ONLY. `auto-initialize` starts a CPython interpreter so `Python::attach`
# works inside `cargo test`; it links `libpython`, which is exactly what an
# extension module must NOT do. Keeping it in `[dev-dependencies]` is what makes
# that safe: Cargo considers dev-dependency features only when building tests,
# benches and examples, so `maturin build`/`develop` -- which builds the cdylib
# with `pyo3/extension-module` from `[tool.maturin] features` -- never sees it.
# The two are incompatible in ONE build (an extension module resolves the Python
# symbols from its host interpreter and must not link a second one), and they
# are never in one build here.
[dev-dependencies]
pyo3 = { version = "=0.29.2", features = ["auto-initialize"] }

[lints]
workspace = true
