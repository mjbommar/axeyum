[package]
name = "axeyum-cnf"
description = "CNF layer for Axeyum: Tseitin encoding, DIMACS I/O, evaluation, and lift maps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = []
# ADR-1703: the `rustsat-batsat` adapter is retired as a shipping engine and
# kept ONLY as a differential oracle, the role ADR-0002 gives Z3. It is not in
# `default`, so the default dependency graph contains none of the three crates
# below -- check with `cargo tree -e normal -p axeyum-cnf`. Slice 2 of ADR-1703
# removes the feature and `src/batsat_reference.rs` together.
#
# A suite behind this feature compiles to ZERO tests without it and exits 0, the
# same trap as `--features z3`. Always confirm a NONZERO test count.
batsat-reference = ["dep:batsat", "dep:rustsat", "dep:rustsat-batsat"]

[dependencies]
axeyum-aig.workspace = true
batsat = { workspace = true, optional = true }
rustsat = { workspace = true, optional = true }
rustsat-batsat = { workspace = true, optional = true }

# Browser-compatible monotonic clock for timeouts/telemetry (ADR-0017); only on
# wasm32, where `std::time::Instant` has no clock in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

# Pure-Rust posix_fadvise for the proof write path (refactor-2026-08 item
# 05.1); unix-only, so wasm32 and other non-unix targets never see it.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
axeyum-bv.workspace = true
axeyum-ir.workspace = true
criterion.workspace = true

[lints]
workspace = true

# Micro-benchmarks (2026-09-05, design review §4 item 3); `harness = false`
# hands control to `criterion`'s own main.
[[bench]]
name = "proof_sat_solve"
harness = false

[[bench]]
name = "tseitin_encode"
harness = false
