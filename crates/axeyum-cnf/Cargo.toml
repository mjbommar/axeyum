[package]
name = "axeyum-cnf"
description = "CNF layer for Axeyum: Tseitin encoding, DIMACS I/O, evaluation, and lift maps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
# ADR-1910 removed `batsat-reference` and the `batsat` / `rustsat` /
# `rustsat-batsat` dependencies it gated -- ADR-1703's deferred slice 2. This
# crate now declares NO optional solver dependency at all. The differential
# referee role moved to `tests/external_sat_referee.rs`, which drives an
# external CaDiCaL / Kissat BINARY over DIMACS text: no Cargo dependency, and
# strictly stronger, because an in-process referee handed our own `CnfFormula`
# could not see a defect in `to_dimacs` or `parse_dimacs` and an external binary
# reading the text can.
default = []

[dependencies]
axeyum-aig.workspace = true

# Browser-compatible monotonic clock for timeouts/telemetry (ADR-0017); only on
# wasm32, where `std::time::Instant` has no clock in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

# Pure-Rust posix_fadvise for the proof write path (refactor-2026-08 item
# 05.1); unix-only, so wasm32 and other non-unix targets never see it.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
axeyum-bv.workspace = true
axeyum-ir.workspace = true
criterion.workspace = true

[lints]
workspace = true

# Micro-benchmarks (2026-09-05, design review §4 item 3); `harness = false`
# hands control to `criterion`'s own main.
[[bench]]
name = "proof_sat_solve"
harness = false

[[bench]]
name = "tseitin_encode"
harness = false

[[bench]]
name = "proof_pipeline"
harness = false

[[bench]]
name = "proof_sat_propagate"
harness = false

# Gaussian elimination / watched-row propagation over GF(2). Added by the
# micro-opt-matrix lane as the POSITIVE CONTROL for the `target-cpu` axis: the
# CDCL core contains no bit-counting at all, so the crate's `count_ones` /
# `trailing_zeros` sites are all on this route and had no bench.
[[bench]]
name = "xor_matrix_gauss"
harness = false
