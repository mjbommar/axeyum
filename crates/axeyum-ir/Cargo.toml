[package]
name = "axeyum-ir"
description = "Typed term IR for the Axeyum automated reasoning stack: sorts, terms, interning, and ground evaluation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# Arbitrary-precision integers/rationals backing `Value::RealAlgebraic`'s storage
# (defining polynomial + isolating interval) and the algebraic-number field-
# arithmetic primitives (resultant + squarefree + Sturm isolation), per ADR-0045.
# Unconditional deps: pure Rust, MIT/Apache-2.0, allowed by the no-C/C++ hard rule
# (`cargo deny` passes them). Algebraic values appear only in NRA witnesses (rare),
# so the always-bignum storage is fine; the core `Rational` type stays `i128`.
axeyum-arith.workspace = true
# Fast, seedless, deterministic hasher for the intern table and lookup maps
# (D5 in the 2026-09-05 performance review); see src/fast_map.rs.
rustc-hash = { workspace = true }

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

# Micro-benchmark (2026-09-05, design review §4 item 3); `harness = false`
# hands control to `criterion`'s own main.
[[bench]]
name = "arena_intern"
harness = false

# Micro-benchmarks (2026-09-07, lane `bench-primitives`). `term_eval` measures
# the ground evaluator, which the hard rules make mandatory on every `sat`
# result; `value_bits` measures the LSB-first conversion helpers that the BV
# model-lifting path calls once per symbol bit.
[[bench]]
name = "term_eval"
harness = false

[[bench]]
name = "value_bits"
harness = false
