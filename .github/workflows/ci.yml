name: CI

on:
  push:
    branches: [main]
    # Docs-only pushes (the curriculum/resource lane lands one every few
    # minutes) skip the heavy build matrix — they cannot change build or test
    # outcomes, and each full 8-job run otherwise saturates the runner pool
    # for hours. The docs themselves are validated by docs-ci.yml on every
    # push. A commit touching BOTH code and docs still runs everything.
    paths-ignore:
      - 'docs/**'
      - 'artifacts/**'
      - 'bench-results/**'
      - '*.md'
      # The curriculum lane's commits touch python generators/validators and
      # the justfile alongside docs — none of which can change cargo
      # build/test outcomes, and docs-ci.yml runs the resource+link checks on
      # EVERY push regardless. Without these two lines each docs(math) commit
      # still launched the full ~3h 8-job matrix and saturated the runner
      # pool (measured 2026-07-03). A commit that ALSO touches any Rust/TOML
      # path still runs everything.
      - 'scripts/**'
      - 'justfile'
      # NOTE: docs/plan/generated/lean-complete-parity.json is CI-validated (the
      # 'docs resources and links' job runs gen-lean-complete-parity.py --check)
      # yet lives under docs/, so a regen-only commit is paths-ignored and won't
      # re-run this workflow. The generator hashes the justfile + scripts, so a
      # commit touching those MUST regenerate the manifest in the SAME commit.
  pull_request:

# Pushes land every few minutes across two agent lanes and a run takes ~20
# minutes: with cancel-in-progress a newer push kills every run before it can
# report, so NO conclusion ever lands. Runners execute in parallel, so letting
# each push's run complete is fine now that the multi-hour test-job hang is
# fixed; the group only serializes runs for the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # z3-sys's build script downloads a prebuilt Z3 release via the GitHub API;
  # unauthenticated requests from shared runners get rate-limited (HTTP 403,
  # and a 3× retry cannot outwait it). The build script sends this token as a
  # Bearer header, lifting the request onto the authenticated quota.
  READ_ONLY_GITHUB_TOKEN: ${{ github.token }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The Python binding gate (docs/python-2026-08/01-pyo3-maturin.md, S5).
  # `scripts/check.sh` SKIPS this gate when `uv`/.venv are absent, which is
  # correct on a fleet host and useless in CI -- so it runs here explicitly,
  # on every interpreter the wheel claims (abi3-py312). Each step prints a
  # count; a `PYTEST|collected=0` or `STUBS|compared=0` fails on its own.
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python }}
      # The suite imports `axeyum.agent` and its sandbox dependency `sympy`.
      # Both live in the declared [agent] extra; installing only `--dev` made
      # collection fail after discovering hundreds of tests.
      - run: uv sync --locked --dev --extra agent --python ${{ matrix.python }}
      - run: uv run --no-sync maturin develop
      - run: uv run --no-sync pytest python/tests -q -p no:cacheprovider
      - run: uv run --no-sync python tools/gen_native_stub.py --check
      - run: uv run --no-sync ruff check python/ tools/
      - run: uv run --no-sync ruff format --check python/ tools/

  # NOTE: the heavy test gate lives in scripts/local-ci.sh, run on local
  # hardware — NOT here. The full-workspace suite (esp. the ~32 z3/cvc5
  # differential-fuzz binaries, 60s+ each) needs real cores; on GitHub's 4-core
  # hosted runners it forced serialization + sharding + a 60-min timeout that
  # still went red (shard 1 cancelled on a4d31228). Locally it runs fully
  # parallel with full coverage in minutes. The `order-255 moment proofs` job
  # moved there too (`scripts/local-ci.sh --moment`). GitHub Actions keeps only
  # the light, fast checks below (fmt/clippy/build/docs/deny) as a cheap first
  # signal on every push; local-ci.sh is the authoritative gate for main.

  cargo-mir-build:
    name: checked Cargo MIR build (nightly-2026-05-01)
    # ADR-0317 seals `cargo -vV`, whose identity includes the runner OS.
    # A floating `ubuntu-latest` cannot reproduce the Ubuntu 26.04 fixture.
    runs-on: ubuntu-26.04
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      AXEYUM_VERIFY_MIR_REQUIRE_CARGO_BUILD: 1
    steps:
      - uses: actions/checkout@v5
      # ADR-0287 binds this channel to rustc commit f53b654a8 and LLVM 22.1.4.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-01
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p axeyum-verify --test cargo_mir_build -- --nocapture

  reflection-semantics-gate:
    name: checked reflection semantics gate
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-reflection-semantics-gate.py --run

  bench-micro:
    name: benchmark micro corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p axeyum-bench -- corpus/micro --backend sat-bv --timeout-ms 1000 --out /tmp/axeyum-bench-micro-sat-bv.json
      - run: cargo run -p axeyum-bench --features z3 -- corpus/micro --backend z3 --timeout-ms 1000 --out /tmp/axeyum-bench-micro-z3.json

  msrv:
    name: check (MSRV 1.88, default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The MSRV promise covers the default (pure Rust) build — the product
      # per ADR-0002. Optional native-oracle features track stable Rust.
      - run: cargo check --workspace

  wasm-qfbv:
    name: build and smoke-test (wasm32 QF_BV profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p axeyum-wasm --target wasm32-unknown-unknown
      - name: install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.123 --locked
      - name: execute SAT and UNSAT smoke cases in Node WebAssembly
        run: |
          wasm-bindgen --target nodejs --out-dir target/wasm-smoke \
            target/wasm32-unknown-unknown/debug/axeyum_wasm.wasm
          AXEYUM_WASM_BUILD_PROFILE=debug \
            node scripts/measure-wasm-qfbv.cjs target/wasm-smoke/axeyum_wasm.js 1

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --all-features --no-deps

  lean-inductive-crosscheck:
    name: real Lean kernel + solver-proof cross-check
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      AXEYUM_REQUIRE_LEAN: 1
      AXEYUM_LEAN_BUDGET_SECS: 0
      AXEYUM_LEAN_JOBS: 2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Axeyum emits standalone Lean modules and is not a Lake project.
      # lean-action requires lake-manifest.json even with every Lake step off,
      # so use the checksum-pinned elan installer and repository toolchain pin.
      - name: install pinned official Lean toolchain
        run: |
          lean_root="$RUNNER_TEMP/axeyum-lean"
          ./scripts/install-pinned-lean.sh "$lean_root"
          elan_home="$lean_root/elan-home"
          lean_toolchain=$(tr -d '[:space:]' < lean-toolchain)
          lean_bin=$(ELAN_HOME="$elan_home" ELAN_TOOLCHAIN="$lean_toolchain" \
            "$elan_home/bin/elan" which lean)
          test -x "$lean_bin"
          (cd "$RUNNER_TEMP" && "$lean_bin" --version)
          echo "ELAN_HOME=$elan_home" >> "$GITHUB_ENV"
          echo "AXEYUM_LEAN_BIN=$lean_bin" >> "$GITHUB_ENV"
          echo "$lean_root/elan-home/bin" >> "$GITHUB_PATH"
      - run: lean --version
      - run: cargo test -p axeyum-lean-kernel --test real_lean_inductive_crosscheck -- --nocapture
      - run: cargo test -p axeyum-lean-kernel --test real_lean_nat_literal_crosscheck -- --nocapture
      - run: cargo test -p axeyum-lean-kernel --test real_lean_strict_positivity_crosscheck -- --nocapture
      - run: cargo test -p axeyum-lean-kernel --test real_lean_structure_eta_crosscheck -- --nocapture
      - run: cargo test -p axeyum-solver --features full --test diophantine_lean_reconstruct diophantine_module_checks_in_real_lean -- --exact --nocapture
      - run: cargo test -p axeyum-solver --features full --test int_inequality_lean_reconstruct int_inequality_module_checks_in_real_lean -- --exact --nocapture
      - run: cargo test -p axeyum-solver --features full --test regex_emptiness_lean_reconstruct regex_emptiness_module_checks_in_real_lean -- --exact --nocapture
      # One module from every registered solver-proof family. The exhaustive
      # every-module sweep remains an explicit release/scheduled stress gate.
      # Resolve the installed binary explicitly so absence cannot become the
      # harness's optional local-development skip.
      #
      # The `grep -Fx` below pins the EXACT summary, which is what stops a
      # vacuous run (0 modules, 0 failures) from reading as a pass. The cost is
      # that ADDING a proof family breaks this job until the number is bumped
      # here -- and that is what happened: the count reached 73 while the pin
      # still said 70, so the job failed on a run whose own output said
      # `checked 73 of 73 ... 0 FAILED`. Bump it in the same commit that adds a
      # family. Measured locally against the pinned Lean 4.30.0 (d024af09)
      # before this was changed: `checked 73 of 73 modules ... 0 FAILED`.
      - name: representative solver proofs in official Lean
        run: |
          test -x "$AXEYUM_LEAN_BIN"
          set -o pipefail
          cargo test -p axeyum-solver --features full --test lean_crosscheck \
            lean_crosscheck_representative -- --nocapture --exact 2>&1 \
            | tee "$RUNNER_TEMP/lean-representative.log"
          grep -Fx \
            'LEAN_CROSSCHECK|label=representative|families=78|modules=78|checked=78|budget_skipped=0|failed=0' \
            "$RUNNER_TEMP/lean-representative.log"
      # L0 kernel differential (ADR-1050). The `kernel_differential` test
      # target ran in NO automated context before this: 0 references in
      # ci.yml, hooks/pre-push and scripts/local-ci.sh alike, against controls
      # of 9, 14 and 3 `cargo test` invocations in those same files.
      #
      # It belongs in THIS job and nowhere else, because it hard-requires the
      # pinned Lean toolchain -- `AXEYUM_REQUIRE_LEAN=1` (already this job's
      # env) turns a missing toolchain into a failure rather than a skip, so
      # in any job without Lean it would go red for the wrong reason. Measured
      # warm on s4: 7s incremental, 27s from a cold-ish target. The script
      # re-derives its verdict from the test's output text (guards G1..G6)
      # instead of trusting the harness exit status alone.
      - run: python3 scripts/check-kernel-differential.py
      # Proves those six guards each still fire on the input that names them.
      - run: python3 scripts/check-kernel-differential-mutants.py

  # L0 trust closure (ADR-1050). Its own job because it shells out to
  # `cargo run --release -p axeyum-lean-kernel --example
  # kernel_declaration_projection`, and NO other job in this file does a
  # release build at all (measured: zero `--release` occurrences before this).
  # `--release` is mandatory for that example -- in debug it SIGABRTs on stack
  # depth building creal/complex/cpoint, which looks like a broken tool rather
  # than a resource limit. Measured warm on s4: 58s once the example is built;
  # the build itself is what `rust-cache` is here for. Runs in parallel, so it
  # extends CI's critical path only if it becomes the slowest job.
  l0-trust-closure:
    name: L0 trust closure (kernel declaration projection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check-trust-closure.py --quiet
      # L0 shape duplicates (ADR-1170), in THIS job because it is the other
      # gate that needs a release build of `axeyum-lean-kernel` -- it shells
      # out to `cargo run --release --example shape_search -- --duplicates`,
      # so it reuses what the step above already built and adds only the
      # example's own link plus a ~50s constructed-environment build.
      #
      # It reports declarations whose admitted TYPES are identical up to
      # binder naming: two proofs of one proposition, which is what failed
      # retrieval produces. Written 2026-08-27, and until 2026-08-31 named by
      # NO gate -- `check.sh` registered only its unit tests. Its first
      # automatic run found five unadjudicated groups, one of them a genuine
      # independent re-derivation.
      - run: python3 scripts/check-shape-duplicates.py

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs-links:
    name: docs resources and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Store evidence validates and reads its sealed implementation commit.
          fetch-depth: 0
      # Keep the duplicated docs gate on the same registered-command boundary
      # as docs-ci.yml; the hosted image does not include `just`.
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: 1.57.0
      # setup-just adds a runner-temporary directory to GITHUB_PATH, while the
      # credited readiness contract deliberately resolves tools only through
      # the canonical account Cargo bin plus system paths. Install a regular
      # copy at that registered path; symlinks are rejected by the contract.
      - name: Install just at the registered readiness path
        run: |
          source_path="$(command -v just)"
          destination="$HOME/.cargo/bin/just"
          mkdir -p "$HOME/.cargo/bin"
          if [[ "$source_path" != "$destination" ]]; then
            install -m 0755 "$source_path" "$destination"
          fi
          test -f "$destination"
          test -x "$destination"
          test ! -L "$destination"
          test "$("$destination" --version)" = "just 1.57.0"
      - run: ./scripts/check-foundational-resources.sh
      # The parity ledger's freshness. `scripts/parity-run.sh` writes this
      # repository's declared headline and was invoked by NO gate -- not
      # `just check`, not `scripts/check.sh`, and not here -- so the board froze
      # on 2026-08-06 for fifteen days and nothing went red. This is cheap: it
      # reads a committed markdown file and re-measures nothing.
      #
      # `fetch-depth: 0` above is load-bearing for the ADVISORY solver-currency
      # column, which resolves each entry's `solver commit` and counts the
      # `crates/` commits since. On a shallow clone those degrade to
      # UNRESOLVABLE rather than failing -- deliberately, but the useful signal
      # is gone, so do not shallow this job.
      - run: ./scripts/tests/test-check-parity-freshness.sh
      - run: ./scripts/check-parity-freshness.py
      - run: python3 -m unittest scripts.tests.test_lean_u2_test_authority
      - run: python3 scripts/gen-lean-u2-test-authority.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_ci_profiles
      - run: python3 scripts/gen-lean-u2-official-ci-profiles.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_child_shards
      - run: python3 scripts/gen-lean-u2-official-child-shards.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_native_surface_classification
      - run: python3 scripts/gen-lean-u2-native-surface-classification.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_native_surface_content
      - run: python3 scripts/gen-lean-u2-native-surface-content.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_native_dependency
      - run: python3 scripts/gen-lean-u2-native-dependency.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_native_dependency_m2_1
      - run: python3 scripts/lean_u2_native_dependency_m2_1.py check-contract
      - run: python3 -m unittest scripts.tests.test_lean_execution_evidence
      - run: python3 scripts/gen-lean-execution-evidence.py --check
      - run: python3 -m unittest scripts.tests.test_lean_execution_process
      - run: python3 scripts/lean_execution_process.py result --check
      - run: python3 -m unittest scripts.tests.test_lean_execution_store
      - run: python3 scripts/lean_execution_store.py result --check
      - run: python3 -m unittest scripts.tests.test_lean_execution_acceptance
      - run: python3 scripts/lean_execution_acceptance.py result --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_r2
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_r3
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_r3_result
      - run: python3 scripts/lean_u2_official_execution_r3_result.py result --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2
      - run: python3 scripts/lean_u2_official_execution_m2.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_store
      - run: python3 scripts/lean_u2_official_execution_m2_store.py --check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_run
      - run: python3 scripts/lean_u2_official_execution_m2_run.py offline-check
      - run: python3 scripts/lean_u2_official_execution_m2_r2.py offline-check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_r3
      - run: python3 scripts/lean_u2_official_execution_m2_r3.py offline-check
      - run: python3 scripts/lean_u2_official_execution_m2_r3.py validate-incomplete
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_r4
      - run: python3 scripts/lean_u2_official_execution_m2_r4.py offline-check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_r5
      - run: python3 scripts/lean_u2_official_execution_m2_r5.py offline-check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_r5_diagnostic
      - run: python3 scripts/lean_u2_official_execution_m2_r5_diagnostic.py offline-check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_r6
      - run: python3 scripts/lean_u2_official_execution_m2_r6.py offline-check
      - run: python3 -m unittest scripts.tests.test_lean_u2_official_execution_m2_r6_result
      - run: python3 scripts/lean_u2_official_execution_m2_r6_result.py result --check
      # These two validate that docs/plan/generated/lean-complete-parity.json is
      # a fresh regeneration. The generator embeds locally-read toolchain versions
      # (lean/python/pkg) + a runner field, so a committed copy cannot reproducibly
      # match the CI runner's regeneration -> chronic false "stale generated file"
      # after any justfile/scripts edit. Non-blocking pending the lean lane making
      # the generator env-independent (cf. the earlier lean evidence-portability
      # fixes). Real parity/soundness is covered by the `test` differential fuzzes.
      - run: python3 -m unittest scripts.tests.test_lean_complete_parity
        continue-on-error: true
      - run: python3 scripts/gen-lean-complete-parity.py --check
        continue-on-error: true
      - run: python3 -m unittest scripts.tests.test_lean_official_construct_matrix
      - run: python3 scripts/check-lean-official-construct-matrix.py --check
      - run: python3 scripts/freeze-lean-official-construct-matrix-stage-b.py --check
      - run: python3 scripts/freeze-lean-official-construct-matrix-product.py --check
      - run: python3 scripts/gen-smtlib-api-conformance.py --check
      - run: python3 scripts/gen-smtlib-session-contract.py --check
      - run: ./scripts/check-smtcomp-resume.sh
      - run: python3 scripts/check-plan-authority.py
      # L0 trusted-library safety gates (ADR-1050). Until now the entire L0
      # programme ran ONLY from `scripts/check.sh` and the `justfile` -- that
      # is, only when a human typed a command. `ci.yml`, `hooks/pre-push` and
      # `scripts/local-ci.sh` (which this file calls "the authoritative gate
      # for main") named none of the seven.
      #
      # These five are pure Python and need no build, which is why they live in
      # this job rather than a cargo one. Measured warm on s4, single run:
      # settled-fact-statements 0.09s, holdout-closed-evaluation 0.06s,
      # semantic-control-fixtures 1.09s, credit-transaction-ledger 10.6s,
      # proposition-duplication 55-72s. Ordered cheapest-first so a fast
      # violation is reported without paying for the slow ones.
      #
      # NO `continue-on-error` on any of these, deliberately: two steps above
      # carry it for a documented lean-parity reason, and a safety gate whose
      # failure is swallowed manufactures the appearance of enforcement.
      # `scripts/check-l0-gate-enforcement.py` fails if one ever acquires it.
      - run: python3 scripts/check-settled-fact-statements.py
      - run: python3 scripts/check-holdout-closed-evaluation.py
      - run: python3 scripts/check-semantic-control-fixtures.py --check
      - run: python3 scripts/check-credit-transaction-ledger.py
      - run: python3 scripts/check-proposition-duplication.py
      # ADR-1050: assert all eight L0 gates stay wired (the five above, the
      # two in the l0-kernel-differential / l0-trust-closure jobs, and
      # check-shape-duplicates alongside the latter). This gate is the
      # reason the block exists at all -- prose did not keep them wired,
      # so a gate does. ~0.1s, pure Python, no build.
      - run: python3 scripts/check-l0-gate-enforcement.py
      - run: python3 -m unittest scripts.tests.test_l0_gate_enforcement
      - run: ./scripts/check-links.sh
