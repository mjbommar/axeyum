[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "axeyum"
description = "Python bindings for the Axeyum automated reasoning stack"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Michael Bommarito", email = "mike@273ventures.com" }]
keywords = ["smt", "sat", "solver", "verification", "symbolic"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
# maturin fills this from `crates/axeyum-py/Cargo.toml`.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/mjbommar/axeyum"

[tool.maturin]
manifest-path = "crates/axeyum-py/Cargo.toml"
module-name = "axeyum._native"
python-source = "python"
# `pyo3/extension-module` lives HERE and nowhere else: as a default Cargo
# feature it makes `cargo test --workspace` fail to link, because a cdylib
# cannot resolve the Python symbols outside an interpreter.
features = ["pyo3/extension-module"]

[dependency-groups]
# `[build-system].requires` provisions the PEP 517 backend, not a runnable
# `maturin` binary. The dev group is what puts one on PATH for
# `uv run maturin develop`.
dev = ["maturin>=1.15,<2", "pytest>=8", "ruff"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
# `-p no:cacheprovider`: the shared checkout must not grow a `.pytest_cache`
# that another lane could sweep into a commit.
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
src = ["python"]
