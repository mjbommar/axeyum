[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "axeyum"
description = "Python bindings for the Axeyum automated reasoning stack"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Michael Bommarito", email = "mike@273ventures.com" }]
keywords = ["smt", "sat", "solver", "verification", "symbolic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    # The wheel is `abi3-py312`, so ONE build serves all three. These rows say
    # which interpreters that wheel is claimed to run on, and the smoke job in
    # `.github/workflows/wheels.yml` imports the same wheel on 3.12 and on 3.14
    # so the claim is measured rather than asserted.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    # NO `Programming Language :: Python :: Free Threading` row, deliberately.
    # We ship a `cp314-cp314t` wheel, but the module declares
    # `#[pymodule(gil_used = true)]`, so importing it RE-ENABLES the GIL and
    # CPython emits a RuntimeWarning saying so (measured 2026-08-24). A
    # free-threading classifier would advertise a property we have not audited.
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# maturin fills this from `crates/axeyum-py/Cargo.toml`.
dynamic = ["version"]

[project.optional-dependencies]
# The agentic layer (docs/python-2026-08/03-agentic-layer.md), exact-pinned.
#
# Exact pins, not ranges, and the reason is measured: pydantic-ai 2.33.0 exists
# BECAUSE `anthropic` 1.0.0 landed on 2026-08-20 and broke unpinned installs,
# and `pydantic-ai-slim` depends on `httpx2`, not `httpx` -- a custom
# `http_client` for `AnthropicProvider` must be an `httpx2.AsyncClient`.
#
# This is an EXTRA and not a dependency group on purpose. Nothing under
# `scripts/` may import it: every gate in `just check` runs on the standard
# library, so a checker that imported `pydantic` would make a fresh-machine
# `./scripts/check.sh` require a network install. The episode artifact crosses
# that boundary as JSON on disk, checked by a stdlib-only
# `scripts/check-agent-episode.py`.
agent = [
    "pydantic-ai-slim[anthropic]==2.33.0",
    "pydantic-graph==2.33.0",
    "pydantic-evals==2.33.0",
    # `axeyum.agent.sandbox`'s import whitelist names sympy, and a whitelist
    # entry for a module the sandbox interpreter cannot import is a capability
    # that only exists in a docstring. The sandbox runs `sys.executable`, so
    # sympy has to be in the SAME environment the agent extra installs.
    "sympy==1.14.0",
]

[project.urls]
Homepage = "https://github.com/mjbommar/axeyum"
Repository = "https://github.com/mjbommar/axeyum"
Documentation = "https://github.com/mjbommar/axeyum/blob/main/docs/user-guide/python.md"
Issues = "https://github.com/mjbommar/axeyum/issues"
Changelog = "https://github.com/mjbommar/axeyum/blob/main/CHANGELOG.md"

[tool.maturin]
# NO `sdist-include`, and the reason is measured rather than assumed.
#
# maturin builds the sdist from the CARGO dependency graph: `maturin sdist`
# here emits Cargo.toml, Cargo.lock, `python/axeyum/**` and exactly the 16
# workspace crates that `crates/axeyum-py` transitively depends on (1221
# entries, 8.1 MB, 2026-08-24). A fresh `uv pip install dist/axeyum-*.tar.gz`
# built and installed it cold in 87 s, which is the only thing that actually
# proves the sdist is complete -- and it runs in CI as the `from-sdist-py312`
# row of the `smoke` job.
#
# The obvious belt-and-braces line, `sdist-include = ["crates/**/*",
# "Cargo.toml", "Cargo.lock"]`, is WORSE THAN NOTHING here: maturin 1.15.0
# ignores the key silently. Probed both ways on 2026-08-24 --
# `sdist-include = ["deny.toml"]` produced no warning and no `deny.toml` in the
# tarball, while `include = [{ path = "deny.toml", format = "sdist" }]` printed
# `Including files matching "deny.toml"` and put it there. So the directive
# would read like a guarantee of sdist completeness while doing nothing at all.
# If a file ever does need adding to the sdist, use the `include` form below
# with `format = "sdist"`.
manifest-path = "crates/axeyum-py/Cargo.toml"
module-name = "axeyum._native"
python-source = "python"
# `pyo3/extension-module` lives HERE and nowhere else: as a default Cargo
# feature it makes `cargo test --workspace` fail to link, because a cdylib
# cannot resolve the Python symbols outside an interpreter.
features = ["pyo3/extension-module"]
# The generated stubs must travel WITH the wheel. `axeyum._native` is a
# compiled `.so`: without these files a consumer's type checker sees the module
# as opaque and every attribute on it as unresolved. They are generated by
# `tools/gen_native_stub.py` and gated against drift by
# `python/tests/test_native_stub_current.py` -- never hand-edited.
include = [
    "python/axeyum/py.typed",
    "python/axeyum/_native/*.pyi",
    # Forwarding stubs for any submodule the package re-registers in
    # `sys.modules` as `axeyum.<name>`; the generator emits them only when the
    # runtime actually does that, so today this glob matches nothing.
    "python/axeyum/*.pyi",
]

[dependency-groups]
# `[build-system].requires` provisions the PEP 517 backend, not a runnable
# `maturin` binary. The dev group is what puts one on PATH for
# `uv run maturin develop`.
dev = [
    "hypothesis>=6.165.10",
    "maturin>=1.15,<2",
    "pytest>=8",
    "ruff",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
# `-p no:cacheprovider`: the shared checkout must not grow a `.pytest_cache`
# that another lane could sweep into a commit.
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
src = ["python"]
