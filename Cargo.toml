[workspace]
resolver = "3"
members = [
    "crates/axeyum-aig",
    "crates/axeyum-bench",
    "crates/axeyum-bv",
    "crates/axeyum-cas",
    "crates/axeyum-cnf",
    "crates/axeyum-egraph",
    "crates/axeyum-evm",
    "crates/axeyum-fp",
    "crates/axeyum-query",
    "crates/axeyum-ir",
    "crates/axeyum-lean-import",
    "crates/axeyum-lean-kernel",
    "crates/axeyum-machine",
    "crates/axeyum-machine-evidence",
    "crates/axeyum-property",
    "crates/axeyum-property-macros",
    "crates/axeyum-py",
    "crates/axeyum-rewrite",
    "crates/axeyum-scenarios",
    "crates/axeyum-search",
    "crates/axeyum-smtlib",
    "crates/axeyum-solver",
    "crates/axeyum-strings",
    "crates/axeyum-verify",
    "crates/axeyum-verify-macros",
    "crates/axeyum-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mjbommar/axeyum"
authors = ["Michael Bommarito <mike@273ventures.com>"]
keywords = ["smt", "sat", "solver", "verification", "symbolic"]
categories = ["science", "mathematics"]

[workspace.dependencies]
axeyum-aig = { path = "crates/axeyum-aig", version = "0.1.0" }
axeyum-bv = { path = "crates/axeyum-bv", version = "0.1.0" }
axeyum-cas = { path = "crates/axeyum-cas", version = "0.1.0" }
axeyum-cnf = { path = "crates/axeyum-cnf", version = "0.1.0" }
axeyum-egraph = { path = "crates/axeyum-egraph", version = "0.1.0" }
axeyum-fp = { path = "crates/axeyum-fp", version = "0.1.0" }
axeyum-ir = { path = "crates/axeyum-ir", version = "0.1.0" }
axeyum-machine = { path = "crates/axeyum-machine", version = "0.1.0" }
axeyum-machine-evidence = { path = "crates/axeyum-machine-evidence", version = "0.1.0" }
axeyum-py = { path = "crates/axeyum-py", version = "0.1.0" }
axeyum-query = { path = "crates/axeyum-query", version = "0.1.0" }
axeyum-scenarios = { path = "crates/axeyum-scenarios", version = "0.1.0" }
axeyum-strings = { path = "crates/axeyum-strings", version = "0.1.0" }
batsat = { version = "0.6.0" }
rustsat = { version = "0.7.5", default-features = false }
rustsat-batsat = { version = "0.7.5" }
proptest = { version = "1", default-features = false, features = ["std"] }
# Micro-benchmark harness (dev-dependency only, pure Rust, MIT/Apache-2.0).
# `default-features = false` + `cargo_bench_support` drops the optional
# `html_reports`/`plotters`/`clap` chain: `just` recipes read criterion's
# plain-text output, not the HTML report, and this keeps the dependency
# surface criterion pulls in minimal. `harness = false` on every `[[bench]]`.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
z3 = { version = "0.20", default-features = false }
# Fast, deterministic, non-cryptographic hasher (rustc's own FxHash), used for
# the term-arena intern table and its lookup maps (D5,
# docs/research/11-design-review/2026-09-05-sat-smt-performance-and-architecture-review.md).
# Pure Rust, MIT/Apache-2.0, no seed (so no RNG dependency and no per-process
# randomization to defeat the "identical construction sequences yield
# identical IDs" promise). See axeyum-ir/src/fast_map.rs for why this crate
# and not `ahash` or `indexmap`.
rustc-hash = { version = "2.1", default-features = false }
# Browser-compatible monotonic clock; only used on wasm32 targets (ADR-0017).
web-time = { version = "1" }
# Pure-Rust (linux_raw backend) syscall wrappers, safe API surface only; used
# on cfg(unix) for posix_fadvise(DONTNEED) on the proof write path (refactor-
# 2026-08 item 05.1). default-features off + "fs"/"std" keeps the linux_raw
# backend selected on this target and libc out of the dependency graph.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic exceptions that fight the ID/arena style this project uses.
module_name_repetitions = "allow"
must_use_candidate = "allow"
